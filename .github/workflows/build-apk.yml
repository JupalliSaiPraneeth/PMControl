name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows one-click manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build OmniControl Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug and Release APKs with Gradle
        working-directory: ./android
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Sign Release APK with V1 (JAR), V2, and V3 Schemes
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          echo "Explicitly applying V1 (JAR), V2, and V3 signatures via apksigner..."
          ($ANDROID_HOME/build-tools/35.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:omnicontrol123 \
            --ks-key-alias omnicontrol \
            --key-pass pass:omnicontrol123 \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK") || \
          ($ANDROID_HOME/build-tools/34.0.0/apksigner sign \
            --ks android/app/release.keystore \
            --ks-pass pass:omnicontrol123 \
            --ks-key-alias omnicontrol \
            --key-pass pass:omnicontrol123 \
            --min-sdk-version 21 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            "$APK")

      - name: Comprehensive APK Verification & Diagnostics Report
        run: |
          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          DEBUG_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          
          echo "=========================================================="
          echo "📋 OMNICONTROL APK VERIFICATION & INTEGRITY REPORT"
          echo "=========================================================="
          
          echo "1. Checking File Existence and Sizes:"
          ls -lh "$RELEASE_APK" "$DEBUG_APK"
          
          echo ""
          echo "2. SHA-256 Checksums:"
          sha256sum "$RELEASE_APK" "$DEBUG_APK"
          
          echo ""
          echo "3. Verifying Release APK Signatures (V1, V2, V3):"
          ($ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$RELEASE_APK") || \
          ($ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$RELEASE_APK")
          
          echo ""
          echo "4. Verifying Debug APK Signatures:"
          ($ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose "$DEBUG_APK") || \
          ($ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$DEBUG_APK")
          
          echo ""
          echo "5. Inspecting Package Badging (aapt2):"
          AAPT2_PATH=$(find $ANDROID_HOME/build-tools -name aapt2 | head -n 1)
          if [ -n "$AAPT2_PATH" ]; then
            $AAPT2_PATH dump badging "$RELEASE_APK" | grep -E "(package|sdkVersion|targetSdkVersion|launchable-activity|native-code)" || true
          fi
          echo "=========================================================="

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniControl-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniControl-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Direct Download
        run: cp android/app/build/outputs/apk/release/app-release.apk OmniControl.apk

      - name: Publish Direct APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OmniControl Android Client (Latest APK)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 OmniControl Mobile Client
            Direct download for Android devices (no zip extraction needed):
            - **[📥 Download OmniControl.apk](https://github.com/${{ github.repository }}/releases/download/latest/OmniControl.apk)**
            
            **Build Details:**
            - Application ID: `com.omnicontrol.app`
            - Min SDK: `21` (Android 5.0+)
            - Target SDK: `34` (Android 14)
            - Signature Schemes: **V1 (JAR) + V2 + V3 Enabled**
          files: OmniControl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
