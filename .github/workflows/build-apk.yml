name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows one-click manual trigger from the GitHub Actions tab

jobs:
  build:
    name: Build OmniControl Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniControl-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK for Direct Download
        run: cp android/app/build/outputs/apk/debug/app-debug.apk OmniControl.apk

      - name: Publish Direct APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "OmniControl Android Client (Latest APK)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ### 📱 OmniControl Mobile Client
            Direct download for Android devices (no extraction required):
            - **[📥 Download OmniControl.apk](https://github.com/${{ github.repository }}/releases/download/latest/OmniControl.apk)**
          files: OmniControl.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
